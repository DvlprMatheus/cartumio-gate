volumes:
  postgres-gate-data:

services:
  app:
    container_name: cartumio-gate-app
    build: 
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      POSTGRES_HOSTNAME: ${POSTGRES_HOSTNAME}
    volumes:
      - ../..:/workspaces:cached
    command: sleep infinity
    network_mode: service:db

  db:
    container_name: postgres-cartumio-gate
    image: postgres:16-alpine
    restart: unless-stopped
    volumes:
      - postgres-gate-data:/var/lib/postgresql
    env_file:
      - .env