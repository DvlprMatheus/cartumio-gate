spring:
  application:
    name: gate
  profiles:
    active: ${SPRING_PROFILES_ACTIVE}
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOSTNAME}:${POSTGRES_PORT}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    open-in-view: true
  flyway:
    enabled: true
    locations:
      - classpath:db/migration
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    virtual-host: ${RABBITMQ_VIRTUAL_HOST}
    listener:
      simple:
        retry:
          enabled: true
          initial-interval: 1000
          max-attempts: 3
          multiplier: 2
          max-interval: 10000

origin:
  base-url: ${ORIGIN_BASE_URL:http://localhost:3000}

brevo:
  api-key: ${BREVO_API_KEY}
  base-url: ${BREVO_API_BASE_URL}
  sender:
    name: ${BREVO_DEFAULT_SENDER_NAME}
    email: ${BREVO_DEFAULT_SENDER_EMAIL}

ratelimit:
  default:
    capacity: 10
    refill: 1m