spring:
  application:
    name: gate
  profiles:
    active: dev
  datasource:
    url: jdbc:postgresql://localhost:5432/cartumio_gate
    username: cartumio_user
    password: cartumio_password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
  flyway:
    enabled: true
    locations:
      - classpath:db/migration